version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # Samlade uppdateringar i stället för en PR per paket. Trettio öppna PR:er
      # blir ingen granskad alls.
      dev-dependencies:
        dependency-type: development
      production-dependencies:
        dependency-type: production
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly

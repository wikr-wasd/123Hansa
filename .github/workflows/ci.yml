name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Type-check, lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Installera beroenden
        run: npm ci --no-audit --no-fund

      # Kärnan körs först och separat. Den kräver ingen databas och inget bygge,
      # så ett fel i affärslogiken ska falla på sekunder — inte efter att hela
      # webben byggts klart.
      - name: Affärslogik (@hansa/core)
        run: npm run test:core

      # continue-on-error är BORTTAGET 2026-09-17. De 722 typfelen är noll:
      # apps/api avvecklades och webbens egna är åtgärdade. Faller det här
      # steget ska CI bli röd — det är hela poängen med att ha det.
      - name: Typkontroll
        run: npm run type-check

      # Kärnan får INTE ha continue-on-error. Går den sönder ska CI bli röd.
      - name: Typkontroll (@hansa/core)
        run: npm run build:core

      # Också utan continue-on-error sedan 2026-09-17. Linten är ren:
      # 0 fel och 0 varningar med --max-warnings 0.
      - name: Lint
        run: npm run lint

      - name: Bygg webben
        run: npm run build:web

  # Behörigheten i databasen testas separat: den kräver Docker och tar därför
  # längre tid, men den får INTE ha continue-on-error. Faller ett RLS-test
  # betyder det att någon kan läsa eller ändra data de inte ska komma åt.
  database:
    name: Behörighet i databasen
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Installera beroenden
        run: npm ci --no-audit --no-fund

      - name: Starta lokal Supabase
        run: npm run db:start

      - name: Kör behörighetstesterna
        run: npm run test:db

      - name: Stoppa
        if: always()
        run: npm run db:stop

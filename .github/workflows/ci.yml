name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Type-check, lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Installera beroenden
        run: npm ci --no-audit --no-fund

      # Kärnan körs först och separat. Den kräver ingen databas och inget bygge,
      # så ett fel i affärslogiken ska falla på sekunder — inte efter att hela
      # webben byggts klart.
      - name: Affärslogik (@hansa/core)
        run: npm run test:core

      # continue-on-error är MEDVETET och TILLFÄLLIGT, av samma skäl som linten
      # nedan. Rotens tsconfig drog tidigare in hela trädet och gav 25 960 fel;
      # efter städningen 2026-09-05 återstår 722 ÄKTA fel i den ärvda koden i
      # apps/web och apps/api. @hansa/core typkontrolleras rent och har ett eget
      # steg utan continue-on-error nedan. Ta bort raden när de 722 är åtgärdade
      # — det är en post i docs/TODO.md.
      - name: Typkontroll (ärvd kod)
        run: npm run type-check
        continue-on-error: true

      # Kärnan får INTE ha continue-on-error. Går den sönder ska CI bli röd.
      - name: Typkontroll (@hansa/core)
        run: npm run build:core

      # continue-on-error är MEDVETET och TILLFÄLLIGT. Den ärvda koden i
      # apps/web och apps/api går inte igenom eslint med --max-warnings 0 än.
      # Att sätta det till false innan koden är städad hade gjort CI rött på
      # varje PR, och en pipeline som alltid är röd läser ingen. Ta bort raden
      # när linten är ren — det är en post i docs/TODO.md.
      - name: Lint
        run: npm run lint
        continue-on-error: true

      - name: Bygg webben
        run: npm run build:web

  # Behörigheten i databasen testas separat: den kräver Docker och tar därför
  # längre tid, men den får INTE ha continue-on-error. Faller ett RLS-test
  # betyder det att någon kan läsa eller ändra data de inte ska komma åt.
  database:
    name: Behörighet i databasen
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Installera beroenden
        run: npm ci --no-audit --no-fund

      - name: Starta lokal Supabase
        run: npm run db:start

      - name: Kör behörighetstesterna
        run: npm run test:db

      - name: Stoppa
        if: always()
        run: npm run db:stop
